<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AfriGenius — Today’s ranks</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="shell">
    <header class="topbar" style="margin-top:12px;">
      <h1 class="hero-title" style="font-size:1.6rem">Today’s ranks</h1>
    </header>

    <div class="glass card">
      <ul class="mini-board" id="fullBoard">
        <li style="text-align: center; color: var(--muted);">Loading ranks...</li>
      </ul>
    </div>
  </div>

  <!-- Bottom Tabbar -->
  <nav class="tabbar">
    <a class="tab" href="index.html">
      <span class="tab-ico">◈</span><span>Home</span>
    </a>
    <a class="tab is-active" href="leaderboard.html">
      <span class="tab-ico">🏆</span><span>Ranks</span>
    </a>
    <a class="tab" href="quiz.html">
      <span class="tab-ico">⚡</span><span>Quiz</span>
    </a>
  </nav>

  <script type="module">
    import { supabase } from './assets/js/supabase.js';
    import { flag } from './assets/js/countries.js';
    import { getTodaysQuiz } from './assets/js/today.js';

    async function loadFullLeaderboard() {
      const { data: { user } } = await supabase.auth.getUser();
      
      // Get active quiz
      const { data: quiz } = await getTodaysQuiz(supabase, 'id');
      if (!quiz) { document.getElementById('fullBoard').innerHTML = '<li style="text-align:center;color:var(--muted)">No active quiz yet.</li>'; return; }

      const { data, error } = await supabase.from('weekly_leaderboard')
        .select('*')
        .eq('quiz_id', quiz.id)
        .order('rank', { ascending: true })
        .limit(10);

      const board = document.getElementById('fullBoard');
      board.innerHTML = '';

      if (!data || data.length === 0) {
        board.innerHTML = '<li style="text-align: center; color: var(--muted);">No players yet. Be the first on the board.</li>';
        return;
      }

      data.forEach(row => {
        // We don't have user_id in the view, so we can't perfectly match, 
        // but we can check if the name matches the current user's profile name for visual highlight.
        // (In a real app, add user_id to the view).
        const isYou = row.full_name === user?.user_metadata?.full_name;
        
        board.innerHTML += `
          <li class="${isYou ? 'is-you' : ''}">
            <span class="rank" style="${row.rank === 1 ? 'color:#FFB627;' : row.rank === 2 ? 'color:#8FB4FF;' : row.rank === 3 ? 'color:#C98A4B;' : ''}">#${row.rank}</span>
            <span class="flag">${flag(row.country)}</span>
            <span class="row-name">${row.full_name} ${isYou ? '' : ''}</span>
            <span class="row-score">${row.score}/10</span>
          </li>
        `;
      });
    }

    loadFullLeaderboard();
  </script>
</body>
        </html>
