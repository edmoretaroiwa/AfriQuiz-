<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050915" />
  <title>AfriGenius — The weekly knowledge arena</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
<body>
  <div class="shell">
    <div class="quiz-meta">
      <a href="index.html" class="logo-link"><img class="logo" src="assets/img/logo.svg" alt="AfriGenius logo" width="64" height="64"><span>AfriGenius</span></a>
      <span class="timer" id="quizTimer" aria-live="polite">5:00</span>
    </div>
    <div id="quizView">
      <div class="quiz-meta"><span class="eyebrow" id="questionProgress">Getting your questions ready</span><span id="streakLabel" class="quiz-counter">🔥 Streak 0</span></div>
      <div class="quiz-progress" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="quizProgress"><i id="quizProgressFill"></i></div>
      <div class="glass card">
        <p class="eyebrow" id="questionCategory">AFRIGENIUS</p>
        <h2 class="question-text" id="questionText" tabindex="-1">Loading question…</h2>
        <div class="options" id="optionsContainer" aria-label="Answer choices"></div>
        <div id="questionExplanation" class="question-explanation" hidden aria-live="polite"></div>
        <div class="question-actions"><button id="nextQuestionBtn" class="btn btn-gold btn-block" type="button" disabled>Next question</button></div>
        <p class="hint" id="quizHint" role="status"></p>
      </div>
    </div>
    <div id="resultView" hidden>
      <div class="glass card result">
        <h1 class="hero-title">Quiz complete</h1>
        <p class="tiles" id="tiles" aria-hidden="true"></p>
        <p class="hero-sub" id="resultMessage">Your results are ready.</p>
        <div class="stats" style="margin-top:20px">
          <div class="stat glass"><p class="stat-label">Score</p><p class="stat-value" id="finalScore">0/0</p></div>
          <div class="stat glass"><p class="stat-label">Accuracy</p><p class="stat-value" id="finalAccuracy">0%</p></div>
          <div class="stat glass"><p class="stat-label">Time</p><p class="stat-value" id="finalTime">0:00</p></div>
        </div>
        <p id="xpEarned" class="result-badge" hidden></p>
        <button id="shareBtn" class="btn btn-gold btn-block" type="button">Share my result on WhatsApp</button>
        <div id="reviewList" class="review-list"></div>
        <a href="leaderboard.html" class="btn btn-ghost btn-block" style="margin-top:18px">See the leaderboard</a>
        <a href="index.html" class="btn btn-block" style="margin-top:8px;background:none;color:var(--muted)">Back home</a>
      </div>
    </div>
  </div>
  <script type="module" src="assets/js/quiz.js"></script>
</body>
</html>
